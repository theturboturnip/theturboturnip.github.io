[projects.warwick_typ_kojipro]
name = "GPU Fluid Simulation/Visualization"
urls = [
    { name="Demo Video", url="https://youtu.be/WKzMIq4EkSs" },
    # { name="More Info", url="https://theturboturnip.com/files/2021-05-fluid-dynamics-opt-viz-presentation.pdf" },
    { name="Presentation", url="https://theturboturnip.com/files/2021-05-fluid-dynamics-opt-viz-presentation.pdf" },
    { name="GitHub", url="https://github.com/theturboturnip/warwick-typ" }
]
description = "For my undergraduate thesis, I built a fluid simulation program with complex real-time visualization. Both components ran on the GPU, using **CUDA** for the simulation and **Vulkan/GLSL** for the visualization. This required me to optimize GPU code in two languages and profile it using **NVIDIA Nsight** to remove pipeline bubbles. The visualization included advanced graphics techniques such as indirect rendering, instanced rendering, compute shaders, and parallel reduction. The engine was written from scratch in **C++**, and required synchronization between multiple CPU threads and multiple GPU processes."
